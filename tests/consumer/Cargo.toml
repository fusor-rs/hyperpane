[package]
name = "hyperpane-consumer"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.fusor]
entry = "web/index.html"
history-fallback = ["/details"]
assets = { "/" = "public" }

[dependencies]
fusor-core = { path = "../../../rust-front/crates/fusor-core", features = ["dom"] }
fusor-components = { path = "../../../rust-front/crates/fusor-components", features = ["browser"] }
fusor-async = { path = "../../../rust-front/crates/fusor-async", features = ["browser"] }
fusor-router = { path = "../../../rust-front/crates/fusor-router", features = ["browser"] }
fusor-worker = { path = "../../../rust-front/crates/fusor-worker" }
wasm-bindgen = "=0.2.117"

[build-dependencies]
fusor-build = { path = "../../../rust-front/crates/fusor-build" }

[lints.rust]
unsafe_code = "forbid"
unused = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
redundant_clone = "deny"
needless_pass_by_value = "deny"
too_many_lines = "deny"
cognitive_complexity = "deny"
wildcard_imports = "deny"
min_ident_chars = "deny"
match_same_arms = "deny"
branches_sharing_code = "deny"
fn_params_excessive_bools = "deny"
struct_excessive_bools = "deny"
excessive_nesting = "deny"
