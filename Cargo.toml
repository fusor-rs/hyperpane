[workspace]
members = ["crates/hyperpane-shell", "crates/hyperpane-cli"]
exclude = ["tests/consumer"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/fusor-rs/hyperpane"

[workspace.lints.rust]
unsafe_code = "forbid"
unused = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
redundant_clone = "deny"
needless_pass_by_value = "deny"
too_many_lines = "deny"
cognitive_complexity = "deny"
wildcard_imports = "deny"
min_ident_chars = "deny"
match_same_arms = "deny"
branches_sharing_code = "deny"
fn_params_excessive_bools = "deny"
struct_excessive_bools = "deny"
excessive_nesting = "deny"

[workspace.dependencies]
hyperpane-shell = { path = "crates/hyperpane-shell", version = "=0.1.0" }
clap = { version = "=4.5.53", features = ["derive"] }
http = "=1.5.0"
semver = "=1.0.28"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tao = "=0.37.1"
tempfile = "=3.23.0"
webbrowser = "=1.2.4"
wry = "=0.57.0"
